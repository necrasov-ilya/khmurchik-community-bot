bot:
  token: ""
  # Optional legacy fallback. Moderation is scoped to the chat where the command is used.
  target_chat_id: 0

server:
  poll_timeout: 30
  allowed_updates: ["message", "my_chat_member"]

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "khmurchik_bot"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: "5m"

defaults:
  timezone: "Europe/Minsk"
  greeting_time: "10:00"
  greeting_enabled: true
  greeting_message: "Я робот, и Паша заставил меня каждое утро желать вам охуенного дня!\n\nОбнял, покружил, на место поставил! 😘"

log:
  level: "info"
